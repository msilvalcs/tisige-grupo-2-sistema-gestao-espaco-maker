name: SIGES CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siges
          POSTGRES_PASSWORD: siges_ci
          POSTGRES_DB: siges
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siges -d siges"
          --health-interval 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://siges:siges_ci@127.0.0.1:5432/siges
      SEED_PASSWORD: CI-Test-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navegador
          path: |
            playwright-report/
            test-results/
