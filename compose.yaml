services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: siges
      POSTGRES_USER: siges
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siges_local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siges -d siges']
      interval: 3s
      retries: 20
volumes:
  postgres_data:
